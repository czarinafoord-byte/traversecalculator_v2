<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Traverse Calculator v2</title>
  <!-- Link to external stylesheet -->
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <h1>Traverse Calculator v2</h1>

  <section id="bearingTools" class="bearing-tools" aria-labelledby="bearingToolsTitle">
    <div class="bearing-tools-heading">
      <strong id="bearingToolsTitle">Bearing Adjustment</strong>
      <span id="selectedBearingLabel">Select a bearing field below</span>
    </div>

    <div class="bearing-tools-controls">
      <div class="bearing-presets" aria-label="Preset bearing adjustments">
        <button type="button" data-bearing-adjustment="180">+180</button>
        <button type="button" data-bearing-adjustment="-180">-180</button>
        <button type="button" data-bearing-adjustment="90">+90</button>
        <button type="button" data-bearing-adjustment="-90">-90</button>
      </div>

      <div class="bearing-custom">
        <label for="customAngleInput">Custom angle</label>
        <input id="customAngleInput" type="text" placeholder="D.MMSS" inputmode="decimal">
        <button id="addCustomAngleBtn" type="button">+ Angle</button>
        <button id="subtractCustomAngleBtn" type="button">- Angle</button>
      </div>
    </div>
  </section>

  <table id="inputTable">
    <tr>
      <th>Type</th>
      <th>Bearing (D.MMSS)</th>
      <th>Dist/Arc</th>
      <th>Radius</th>
      <th>Dir</th>
      <th>
        <div class="action-header">
          <span>Action</span>
          <button id="addLineTopBtn" type="button">Add Line</button>
        </div>
      </th>
    </tr>
    <!-- rows get added here via addLine() -->
  </table>

  <button id="addLineBtn">Add Line</button>
  <button id="calcBtn">Calculate</button>
  <button id="printBtn">Print to PDF</button>

  <pre id="output"></pre>
  <canvas id="canvas" width="600" height="600"></canvas>

  <script src="script.js?v=5"></script>
</body>
</html>
